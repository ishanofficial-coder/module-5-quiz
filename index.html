<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic & Multimedia AI Master Quiz</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --correct-color: #22c55e;
            --incorrect-color: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #94a3b8;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            text-align: left;
            color: var(--text-color);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:not([disabled]):hover {
            border-color: var(--accent-color);
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            color: white;
            border-color: var(--correct-color);
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-color) !important;
            color: white;
            border-color: var(--incorrect-color);
        }

        .footer-controls {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        /* Leaderboard Style */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table th {
            background-color: #0f172a;
            color: #94a3b8;
        }

        .rank {
            font-weight: bold;
            width: 50px;
            text-align: center;
        }

        .top-1 { color: #f59e0b; }
        .top-2 { color: #94a3b8; }
        .top-3 { color: #b45309; }

        .score-summary {
            text-align: center;
            font-size: 22px;
            margin: 15px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Start Screen -->

            <p style="text-align: center; color: #94a3b8; margin-bottom: 25px;">

            <input type="text" id="player-name" placeholder="Enter Your Name..." autocomplete="off">
            <button class="btn" onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-count">Question 1/100</span>
                <span id="score-tracker">Score: 0</span>
            </div>
            <div class="question-text" id="question-text">Loading question...</div>
            <div class="options-container" id="options-container"></div>
            <div class="footer-controls">
                <button class="btn" id="next-btn" onclick="nextQuestion()" style="display:none; width: auto; padding: 10px 24px;">Next Question</button>
            </div>
        </div>

        <!-- End & Leaderboard Screen -->
        <div id="end-screen" class="screen">
            <h2>Quiz Completed!</h2>
            <div class="score-summary" id="final-score">You scored 0 / 100</div>
            
            <h3>Global Leaderboard</h3>

                        <tr>
                            <th class="rank">Rank</th>
                            <th>Name</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Leaderboard entries -->
                    </tbody>
                </table>
            </div>

            <button class="btn" onclick="restartQuiz()" style="margin-top: 15px;">Play Again</button>
        </div>
    </div>

        // --- APP STATE ---
        let currentQuestionIndex = 0;

        // --- GLOBAL LEADERBOARD STORAGE (JSONbin API Fallback to LocalStorage) ---
        // Public Shared Endpoint for synced global leaderboard across devices
        const BIN_ID = '65e8a71d1f5677dbd695b123'; // Public JSONBin placeholder
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // --- DOM ELEMENTS ---
        const startScreen = document.getElementById('start-screen');

        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');

        const finalScore = document.getElementById('final-score');
        const leaderboardBody = document.getElementById('leaderboard-body');

        // --- FUNCTIONS ---
        function startQuiz() {
            const name = playerNameInput.value.trim();
            if (!name) {
                alert("Please enter your name to start the quiz!");
                return;
            }
            playerName = name;
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            startScreen.classList.remove('active');
            quizScreen.classList.add('active');

            showQuestion();
        }

        function showQuestion() {
            nextBtn.style.display = 'none';
            optionsContainer.innerHTML = '';

            const q = questions[currentQuestionIndex];
            questionText.textContent = q.q;
            questionCount.textContent = `Question ${currentQuestionIndex + 1}/${questions.length}`;
            scoreTracker.textContent = `Score: ${score}`;

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            const q = questions[currentQuestionIndex];
            const allBtns = optionsContainer.querySelectorAll('.option-btn');

            // Disable all buttons once selected
            allBtns.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.answer) {
                selectedBtn.classList.add('correct');
                score++;
                scoreTracker.textContent = `Score: ${score}`;
            } else {
                selectedBtn.classList.add('incorrect');
                // Highlight correct option in green
                allBtns[q.answer].classList.add('correct');
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.style.display = 'block';
            } else {
                nextBtn.textContent = 'Finish & See Leaderboard';
                nextBtn.style.display = 'block';
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            quizScreen.classList.remove('active');
            endScreen.classList.add('active');

            finalScore.textContent = `${playerName}, You Scored ${score} / ${questions.length}`;

            saveScore(playerName, score);
        }

        function saveScore(name, userScore) {
            // Local Storage Logic
            let localScores = JSON.parse(localStorage.getItem('quiz_leaderboard')) || [];
            
            // Existing user update or new add
            const existingIndex = localScores.findIndex(item => item.name.toLowerCase() === name.toLowerCase());
            if (existingIndex > -1) {
                if (userScore > localScores[existingIndex].score) {
                    localScores[existingIndex].score = userScore;
                }
            } else {
                localScores.push({ name: name, score: userScore, date: new Date().toLocaleDateString() });
            }

            // Sort High to Low
            localScores.sort((a, b) => b.score - a.score);
            localStorage.setItem('quiz_leaderboard', JSON.stringify(localScores));

            renderLeaderboard(localScores);
        }

        function renderLeaderboard(scores) {
            leaderboardBody.innerHTML = '';
            scores.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                
                let rankClass = '';
                if (idx === 0) rankClass = 'top-1';
                else if (idx === 1) rankClass = 'top-2';
                else if (idx === 2) rankClass = 'top-3';

                tr.innerHTML = `
                    <td class="rank ${rankClass}">#${idx + 1}</td>
                    <td style="font-weight: 600;">${escapeHtml(entry.name)}</td>
                    <td><strong style="color: var(--accent-color);">${entry.score}</strong> / 100</td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function restartQuiz() {
            endScreen.classList.remove('active');
            startScreen.classList.add('active');
            playerNameInput.value = '';
        }
    </script>
</body>
</html>
