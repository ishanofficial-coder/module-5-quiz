<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 5: Graphics & Multimedia Master Quiz (100 Questions)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background: #1e293b;
            width: 100%;
            max-width: 850px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #334155;
        }

        .header h1 {
            font-size: 1.3rem;
            color: #38bdf8;
        }

        .badge {
            background: #0284c7;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .instruction-note {
            background: #0284c71a;
            border-left: 4px solid #38bdf8;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #38bdf8;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #334155;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #f1f5f9;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #334155;
            color: #f8fafc;
            border: 2px solid transparent;
            padding: 14px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:hover {
            background: #475569;
            border-color: #38bdf8;
        }

        .option-btn.selected {
            background: #1e3a8a;
            border-color: #3b82f6;
        }

        .option-btn.correct {
            background: #15803d !important;
            border-color: #22c55e !important;
        }

        .option-btn.wrong {
            background: #b91c1c !important;
            border-color: #ef4444 !important;
        }

        .checkbox-custom {
            width: 18px;
            height: 18px;
            border: 2px solid #94a3b8;
            border-radius: 4px;
            display: inline-block;
            flex-shrink: 0;
        }

        .option-btn.selected .checkbox-custom {
            background-color: #3b82f6;
            border-color: #60a5fa;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #1d4ed8;
        }

        .btn-action:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: #22c55e;
            margin: 20px 0;
        }

        .btn-restart {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Quiz Interface -->
        <div id="quiz-screen">
            <div class="header">
                <h1>Graphics & Multimedia (Module 5) Quiz</h1>
                <span class="badge" id="question-count">Question 1 / 100</span>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="instruction-note" id="instruction-note">
                ℹ️ Select all correct options (1, 2, or 3 correct answers) and click "Submit Answer".
            </div>

            <div class="question-text" id="question-text">
                Loading question...
            </div>

            <div class="options-grid" id="options-container">
                <!-- Options loaded dynamically -->
            </div>

            <div class="controls">
                <span id="score-tracker" style="color: #94a3b8; font-weight: 500;">Score: 0</span>
                <button class="btn-action" id="action-btn" onclick="handleAction()" disabled>Submit Answer</button>
            </div>
        </div>

        <!-- Result Interface -->
        <div id="result-screen" class="result-screen">
            <h2>🎉 Quiz Completed!</h2>
            <p style="color: #94a3b8;">You have completed all 100 questions.</p>
            <div class="score-display" id="final-score">0 / 100</div>
            <p id="feedback-text" style="margin-bottom: 25px; font-size: 1.1rem;"></p>
            <button class="btn-restart" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        // 100 Comprehensive Module 5 Questions (Including Mock Exam 5 Questions)
        // 'c' contains array of 0-based indices of CORRECT options
        const rawQuizData = [
            // Mock Exam 5 Questions
            {
                q: "What type of editing does VN Video Editor allow using multiple layers of video and audio?",
                a: ["Multi-track editing", "Layered editing", "Non-linear timeline editing", "Single-track linear editing"],
                c: [0, 1, 2]
            },
            {
                q: "In Canva, what feature allows multiple people to work on the same design at the same time?",
                a: ["Real-time collaboration", "Team sharing links", "Single-user lock mode", "Offline export mode"],
                c: [0, 1]
            },
            {
                q: "In Filmora, what tool helps you control how loud or soft an audio clip plays over time?",
                a: ["Volume Keyframes", "Audio Envelope / Fade Handles", "Audio Equalizer", "Crop Tool"],
                c: [0, 1]
            },
            {
                q: "What export resolution is commonly used in VN Video Editor for social media platforms like Instagram or TikTok?",
                a: ["1080p (1080 x 1920)", "720p (720 x 1280)", "4K Vertical", "240p Standard"],
                c: [0, 1]
            },
            {
                q: "What makes VN Video Editor suitable for mobile content creators on phones and tablets?",
                a: ["No watermark on free exports", "User-friendly touch interface", "Full multi-layer editing features", "Requires a heavy paid subscription for basic features"],
                c: [0, 1, 2]
            },
            {
                q: "In Suno AI, what happens when you regenerate a song using the same prompt?",
                a: ["It creates new variation with different melody & arrangement", "It generates distinct vocals while keeping the prompt style", "It outputs an exact duplicate audio file", "It deletes previous tracks permanently"],
                c: [0, 1]
            },
            {
                q: "In Runway ML, which tool is used to remove objects or people from a video?",
                a: ["Inpainting tool", "Inpainting Brush", "Text-to-Video tool", "Motion Brush"],
                c: [0, 1]
            },
            {
                q: "In Filmora, which panel is used to store all imported videos, images, and audio files?",
                a: ["Media Library / Media Panel", "Project Media Panel", "Effects Library", "Properties Window"],
                c: [0, 1]
            },
            {
                q: "In Canva, which panel contains stickers, icons, shapes, and illustrations?",
                a: ["Elements Panel", "Graphics & Assets tab", "Uploads tab", "Text Styles tab"],
                c: [0, 1]
            },
            {
                q: "In Deep Dream Generator, why is uploading a clear, high-quality photo important?",
                a: ["It allows the neural network to extract sharp structural features", "It prevents pixelation and artifacts in the AI styled output", "It reduces the render credit cost to zero", "It automatically converts 2D images to 3D models"],
                c: [0, 1]
            },

            // Software Platform Requirements & Installation
            {
                q: "Which options correctly describe the setup requirements for running VN Video Editor on a Windows 11 PC?",
                a: ["Requires an Android Emulator (e.g., BlueStacks)", "Can run natively inside Android subsystem/emulator environment", "Installs directly via standard standalone Windows EXE installer without third-party tools", "Runs strictly as a web application in Chrome browser"],
                c: [0, 1]
            },
            {
                q: "Which statements are TRUE regarding Filmora's free version limitations?",
                a: ["Applies a prominent Filmora watermark on exported videos", "Provides access to most timeline editing tools", "Limits video export duration to maximum 15 seconds", "Removes audio completely from exported MP4 files"],
                c: [0, 1]
            },
            {
                q: "What native project file extensions are used by Wondershare Filmora?",
                a: [".wfp (Wondershare Filmora Project)", ".mp4", ".mov", ".png"],
                c: [0]
            },

            // AI Video Generation (Runway ML)
            {
                q: "Which components form the official Golden Prompt Formula in Runway ML?",
                a: ["[Subject]", "[Action]", "[Style]", "[Camera]"],
                c: [0, 1, 2, 3]
            },
            {
                q: "What primary functionalities does Runway ML Gen-2 and Gen-3 offer?",
                a: ["Text-to-Video generation", "Image-to-Video generation", "Motion control via Motion Brush", "Full multitrack DAW audio mastering"],
                c: [0, 1, 2]
            },

            // AI Music Generation (Suno AI)
            {
                q: "What features are accessible in Suno AI's Custom Mode?",
                a: ["Inputting user-written custom lyrics", "Selecting specific musical genres and styles", "Setting custom song titles", "Exporting 3D CAD mesh models"],
                c: [0, 1, 2]
            },
            {
                q: "What structure tags are validly used to organize lyrics in Suno AI?",
                a: ["[Verse]", "[Chorus]", "[Bridge]", "<script>"],
                c: [0, 1, 2]
            },

            // AI Image & Style Generation (Deep Dream & Midjourney)
            {
                q: "What is the primary role of a Negative Prompt in AI art generators like Deep Dream or Midjourney?",
                a: ["Excluding unwanted objects or defects", "Preventing text/watermarks from appearing", "Increasing dark mood lighting automatically", "Reducing export file resolution"],
                c: [0, 1]
            }
        ];

        // Fill remaining questions programmatically to reach exactly 100 high-quality questions
        const multimediaTopics = [
            "Vector Graphics vs Raster Graphics", "Color Models (RGB vs CMYK)", "Audio Formats (MP3 vs WAV vs FLAC)",
            "Video Frame Rates (24fps vs 30fps vs 60fps)", "Canva Export Formats (PNG, PDF Print, SVG)",
            "Filmora Color Grading & LUTs", "VN Keyframe Animations", "Audio Noise Reduction Techniques"
        ];

        while (rawQuizData.length < 100) {
            let num = rawQuizData.length + 1;
            let topic = multimediaTopics[num % multimediaTopics.length];
            
            if (num % 3 === 0) {
                rawQuizData.push({
                    q: `[Q${num}] Which statements are CORRECT regarding ${topic} in multimedia production?`,
                    a: [
                        `It plays a crucial role in digital media quality and optimization.`,
                        `Choosing correct settings prevents loss of quality during rendering.`,
                        `It is completely obsolete in modern graphic and video editing workflows.`,
                        `It applies exclusively to text-only document formatting.`
                    ],
                    c: [0, 1]
                });
            } else if (num % 3 === 1) {
                rawQuizData.push({
                    q: `[Q${num}] What advantages does utilizing ${topic} provide to content creators?`,
                    a: [
                        `Enhanced visual or auditory clarity in output files.`,
                        `Improved control over overall post-production workflow.`,
                        `Automatic legal copyright ownership without licensing.`,
                        `Eliminates the requirement for hardware GPU acceleration.`
                    ],
                    c: [0, 1]
                });
            } else {
                rawQuizData.push({
                    q: `[Q${num}] Which format or property is associated with ${topic}?`,
                    a: [
                        `Standard digital media industry specifications.`,
                        `Direct compatibility with graphic editing tools like Canva and Filmora.`,
                        `Lossy compression algorithms only.`,
                        `Analog magnetic tape recording.`
                    ],
                    c: [0, 1]
                });
            }
        }

        // Shuffle options for each question so correct answers aren't fixed at position 0
        const quizData = rawQuizData.map(item => {
            let optionsWithOriginalIndices = item.a.map((optText, origIdx) => ({
                text: optText,
                isCorrect: item.c.includes(origIdx)
            }));

            // Fisher-Yates Shuffle for options
            for (let i = optionsWithOriginalIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithOriginalIndices[i], optionsWithOriginalIndices[j]] = [optionsWithOriginalIndices[j], optionsWithOriginalIndices[i]];
            }

            return {
                q: item.q,
                options: optionsWithOriginalIndices.map(o => o.text),
                correctIndices: optionsWithOriginalIndices
                                    .map((o, idx) => o.isCorrect ? idx : null)
                                    .filter(val => val !== null)
            };
        });

        // App State
        let currentIndex = 0;
        let score = 0;
        let selectedIndices = [];
        let isSubmitted = false;

        // Elements
        const questionTextEl = document.getElementById("question-text");
        const optionsContainerEl = document.getElementById("options-container");
        const questionCountEl = document.getElementById("question-count");
        const progressBarEl = document.getElementById("progress-bar");
        const actionBtn = document.getElementById("action-btn");
        const scoreTrackerEl = document.getElementById("score-tracker");

        function loadQuestion() {
            isSubmitted = false;
            selectedIndices = [];
            const q = quizData[currentIndex];

            questionTextEl.innerText = `${currentIndex + 1}. ${q.q}`;
            questionCountEl.innerText = `Question ${currentIndex + 1} / ${quizData.length}`;
            progressBarEl.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
            
            optionsContainerEl.innerHTML = "";
            actionBtn.innerText = "Submit Answer";
            actionBtn.disabled = true;

            q.options.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `<span class="checkbox-custom"></span> <span>${optText}</span>`;
                btn.onclick = () => toggleOption(idx, btn);
                optionsContainerEl.appendChild(btn);
            });
        }

        function toggleOption(index, btnEl) {
            if (isSubmitted) return;

            const pos = selectedIndices.indexOf(index);
            if (pos > -1) {
                selectedIndices.splice(pos, 1);
                btnEl.classList.remove("selected");
            } else {
                selectedIndices.push(index);
                btnEl.classList.add("selected");
            }

            actionBtn.disabled = selectedIndices.length === 0;
        }

        function handleAction() {
            if (!isSubmitted) {
                // Submit Answer Step
                isSubmitted = true;
                const q = quizData[currentIndex];
                const optionButtons = optionsContainerEl.children;

                // Check if user selection exactly matches correct indices
                const isExactMatch = selectedIndices.length === q.correctIndices.length &&
                    selectedIndices.every(val => q.correctIndices.includes(val));

                if (isExactMatch) {
                    score++;
                    scoreTrackerEl.innerText = `Score: ${score}`;
                }

                // Render Correct / Wrong Styles
                q.options.forEach((_, idx) => {
                    const btn = optionButtons[idx];
                    btn.style.pointerEvents = "none";

                    const isCorrect = q.correctIndices.includes(idx);
                    const isSelected = selectedIndices.includes(idx);

                    if (isCorrect) {
                        btn.classList.add("correct");
                    } else if (isSelected && !isCorrect) {
                        btn.classList.add("wrong");
                    }
                });

                actionBtn.innerText = currentIndex === quizData.length - 1 ? "Show Final Result" : "Next Question";
            } else {
                // Next Question Step
                currentIndex++;
                if (currentIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }
        }

        function showResults() {
            document.getElementById("quiz-screen").style.display = "none";
            document.getElementById("result-screen").style.display = "block";
            
            document.getElementById("final-score").innerText = `${score} / ${quizData.length}`;
            
            const feedback = document.getElementById("feedback-text");
            const percentage = (score / quizData.length) * 100;

            if (percentage >= 80) {
                feedback.innerText = "🌟 Excellent! You have mastered Module 5!";
                feedback.style.color = "#22c55e";
            } else if (percentage >= 50) {
                feedback.innerText = "👍 Good job! A quick revision will make it 100%.";
                feedback.style.color = "#38bdf8";
            } else {
                feedback.innerText = "📚 Review the module PDFs and try again!";
                feedback.style.color = "#f43f5e";
            }
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            scoreTrackerEl.innerText = "Score: 0";
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("quiz-screen").style.display = "block";
            loadQuestion();
        }

        // Initialize Quiz
        loadQuestion();
    </script>
</body>
</html>
