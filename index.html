        let currentQuestionIndex = 0;
        let score = 0;
        let playerName = "";
        let selectedOptions = [];

        // --- DOM ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const endScreen = document.getElementById('end-screen');
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const instructionTag = document.getElementById('instruction-tag');
        const optionsContainer = document.getElementById('options-container');
        const questionCount = document.getElementById('question-count');
        const scoreTracker = document.getElementById('score-tracker');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const finalScore = document.getElementById('final-score');
        const leaderboardBody = document.getElementById('leaderboard-body');

        // --- FUNCTIONS ---
        function startQuiz() {
            const name = playerNameInput.value.trim();
            if (!name) {
                alert("Please enter your name to start!");
                return;
            }
            playerName = name;
            currentQuestionIndex = 0;
            score = 0;

            startScreen.classList.remove('active');
            quizScreen.classList.add('active');

            showQuestion();
        }

        function showQuestion() {
            submitBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            optionsContainer.innerHTML = '';
            selectedOptions = [];

            const q = questions[currentQuestionIndex];
            questionText.textContent = q.q;
            questionCount.textContent = `Question ${currentQuestionIndex + 1}/${questions.length}`;
            scoreTracker.textContent = `Score: ${score}`;

            const isMulti = q.answer.length > 1;
            instructionTag.textContent = isMulti ? `* Select ${q.answer.length} correct answers!` : "* Select 1 correct answer";

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${isMulti ? '☐' : '⚪'}</span> <span>${option}</span>`;
                btn.onclick = () => handleOptionClick(index, btn, isMulti);
                optionsContainer.appendChild(btn);
            });

            if (isMulti) {
                submitBtn.style.display = 'block';
            }
        }

        function handleOptionClick(index, btn, isMulti) {
            if (!isMulti) {
                evaluateAnswer([index]);
            } else {
                const pos = selectedOptions.indexOf(index);
                if (pos > -1) {
                    selectedOptions.splice(pos, 1);
                    btn.classList.remove('selected');
                    btn.querySelector('span').textContent = '☐';
                } else {
                    selectedOptions.push(index);
                    btn.classList.add('selected');
                    btn.querySelector('span').textContent = '☑';
                }
            }
        }

        function submitMultiAnswer() {
            if (selectedOptions.length === 0) {
                alert("Please select at least one option!");
                return;
            }
            evaluateAnswer(selectedOptions);
        }

        function evaluateAnswer(userChoices) {
            const q = questions[currentQuestionIndex];
            const allBtns = optionsContainer.querySelectorAll('.option-btn');

            allBtns.forEach(btn => btn.disabled = true);
            submitBtn.style.display = 'none';

            const isCorrect = arraysEqual(userChoices.sort(), q.answer.sort());

            if (isCorrect) {
                score++;
                scoreTracker.textContent = `Score: ${score}`;
            }

            allBtns.forEach((btn, idx) => {
                btn.classList.remove('selected');
                if (q.answer.includes(idx)) {
                    btn.classList.add('correct');
                } else if (userChoices.includes(idx)) {
                    btn.classList.add('incorrect');
                }
            });

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.style.display = 'block';
            } else {
                nextBtn.textContent = 'Finish & See Leaderboard';
                nextBtn.style.display = 'block';
            }
        }

        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            quizScreen.classList.remove('active');
            endScreen.classList.add('active');

            finalScore.textContent = `${playerName}, You Scored ${score} / ${questions.length}`;

            saveAndFetchScores(playerName, score);
        }

        // --- GLOBAL LEADERBOARD LOGIC (FIREBASE REALTIME DATABASE) ---
        function saveAndFetchScores(name, userScore) {
            let localScores = JSON.parse(localStorage.getItem('quiz_leaderboard')) || [];
            const existingIndex = localScores.findIndex(item => item.name.toLowerCase() === name.toLowerCase());
            if (existingIndex > -1) {
                if (userScore > localScores[existingIndex].score) {
                    localScores[existingIndex].score = userScore;
                }
            } else {
                localScores.push({ name: name, score: userScore });
            }
            localStorage.setItem('quiz_leaderboard', JSON.stringify(localScores));

            if (db) {
                const userKey = name.replace(/[.#$/[\]]/g, "_");
                const userRef = db.ref('leaderboard/' + userKey);

                userRef.get().then((snapshot) => {
                    if (snapshot.exists()) {
                        const currentData = snapshot.val();
                        if (userScore > currentData.score) {
                            userRef.set({ name: name, score: userScore });
                        }
                    } else {
                        userRef.set({ name: name, score: userScore });
                    }
                    fetchGlobalLeaderboard();
                }).catch((err) => {
                    console.warn("Firebase read error, using local fallback", err);
                    renderLeaderboard(localScores);
                });
            } else {
                renderLeaderboard(localScores);
            }
        }

        function fetchGlobalLeaderboard() {
            if (!db) return;
            
            db.ref('leaderboard').orderByChild('score').limitToLast(50).once('value', (snapshot) => {
                let scoresArray = [];
                snapshot.forEach((childSnapshot) => {
                    scoresArray.push(childSnapshot.val());
                });
                scoresArray.sort((a, b) => b.score - a.score);
                renderLeaderboard(scoresArray);
            });
        }

        function renderLeaderboard(scores) {
            leaderboardBody.innerHTML = '';
            if (!scores || scores.length === 0) {
                leaderboardBody.innerHTML = '<tr><td colspan="3" style="text-align: center;">No scores recorded yet.</td></tr>';
                return;
            }

            scores.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                let rankClass = idx === 0 ? 'top-1' : idx === 1 ? 'top-2' : idx === 3 ? 'top-3' : '';

                tr.innerHTML = `
                    <td class="rank ${rankClass}">#${idx + 1}</td>
                    <td style="font-weight: 600;">${escapeHtml(entry.name)}</td>
                    <td><strong style="color: var(--accent-color);">${entry.score}</strong> / 100</td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function restartQuiz() {
            endScreen.classList.remove('active');
            startScreen.classList.active;
            startScreen.classList.add('active');
            playerNameInput.value = '';
        }
    </script>
</body>
</html>
